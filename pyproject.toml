[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wow-collection-planner"
version = "0.1.0"
description = "Planejador de personagens e colecionismo para World of Warcraft: Forever (CLI + SQLite)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wow-plan = "wow_planner.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wow_planner = ["game_data/data/*.yaml", "game_data/data/*.json", "migrations/*.sql", "importers/*.yaml", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["with_att: servidor de teste aponta para a fixture do ATT"]
