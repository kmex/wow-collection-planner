# Racials do WoW: Forever.
# - "effect" parafraseia os guias; números só aparecem quando um guia os publicou.
# - cooldown aqui é só referência; o valor exibido vem do tooltip oficial (Warcraft DB), atualizado
#   pelo botão "Atualizar racials" / `wow-plan update-racials`. Correções de 2026-10-27 vieram dessa fonte.
# - pvp_value / pve_value (0-3) são AVALIAÇÃO DO APP (confidence: analysis implícita), não dado oficial.
version: "2026-10-27"

_refs:
  rb: &rb
    source: "https://rankedboost.com/world-of-warcraft/forever/race/"
    last_verified: "2026-10-26"
    confidence: community
  wt: &wt
    source: "https://www.warcrafttavern.com/forever/guides/racial-abilities/"
    last_verified: "2026-10-26"
    confidence: guide
  wt_races: &wt_races
    source: "https://www.warcrafttavern.com/forever/guides/races/"
    last_verified: "2026-10-26"
    confidence: guide
  bliz: &bliz
    source: "https://us.forums.blizzard.com/en/wow/t/2360696/7"
    last_verified: "2026-10-27"
    confidence: official
    patch: "lançamento (anunciado 26/10, editado 27/10)"
  classic_unverified: &classic_unverified
    source: "Comportamento conhecido do WoW Classic — NÃO verificado no Forever"
    last_verified: "2026-10-26"
    confidence: unverified

