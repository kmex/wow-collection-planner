name: Release
# Cria a versão para download ao enviar uma tag vX.Y.Z (ex.: git tag v0.1.0 && git push --tags)
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" build
      - run: python -m pytest -q
      - name: Wheel
        run: python -m build --wheel
      - name: Zip para Windows
        run: |
          NAME="wow-collection-planner-${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="${NAME}/" -o "dist/${NAME}.zip" HEAD
      - name: Notas da versão
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '$0 ~ "^## \\["v"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          printf '\n---\n**Como instalar (Windows):** baixe o `.zip`, extraia e dê dois cliques em `setup.bat`. Depois use `abrir-interface.bat`.\n' >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/*.zip
            dist/*.whl
